baseURL: "https://bjachlxam.github.io/"
title: "The Digital Nomad Way"
theme: ["hugo-theme-dream"]
locale: en
defaultContentLanguage: en

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 9

minify:
  disableXML: true

params:
  author: Laowang
  description: "Laowang's personal journey into the digital nomad life."
  headerTitle: "The Digital Nomad Way"
  motto: "Work remotely. Live anywhere."
  lightTheme: "emerald"
  darkTheme: "forest"
  siteStartYear: 2026
  rss: true
  stickyNav: true
  showTableOfContents: true
  showSummaryCoverInPost: true
  showPrevNextPost: true
  customSyntaxHighlighting: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai
    lineNos: true
    codeFences: true
    guessSyntax: true
