# Affiliate platforms, one section per platform.
#
# Two ways to configure a platform:
#   url = "..."   — a full pre-generated tracking link (e.g. Travelpayouts shortlink)
#   id  = "..."   — a raw tracking query string appended to an auto-built
#                   Booking.com hotel URL, e.g. id = "aid=1234567"
#
# A platform section only renders a button when it has a link (url or id).
# Everything updates site-wide automatically — no post edits needed.

[booking]
id = ""
name = "Booking.com"

[klook]
url = "https://klook.tpx.li/UxQ5P9T3"
name = "Klook"

# Future platforms — uncomment and fill in when approved:
