media:
  name: images
  label: Images
  input: static/images
  output: /images
  categories: [image]

content:
  - name: posts
    label: Blog Posts
    description: Write a new post. The body supports Markdown; images can be dragged in.
    type: collection
    path: content/posts
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Publish Date
        type: date
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Drafts are saved but hidden from the live site.
      - name: description
        label: Summary
        type: text
        description: A one-sentence summary used in listings and SEO.
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text
